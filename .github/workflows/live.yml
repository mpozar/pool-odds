name: live-tick

# Game-time updates for the pool page: live/tick.py reads live/snapshot.json
# (published post-lock from a residential machine; Splash's firewall blocks
# datacenter IPs) and ESPN's public scoreboard, and idles in seconds outside
# game windows. The cron covers 13:00-06:00 UTC daily, which spans every NFL
# kickoff slot (international mornings through late MNF) on any day of the
# week, holidays included.

on:
  workflow_dispatch:
    inputs:
      touch:
        description: "write live/heartbeat.json to test the push->Pages path"
        required: false
        default: ""
  schedule:
    - cron: "*/5 13-23 * * *"
    - cron: "*/5 0-5 * * *"

permissions:
  contents: write

concurrency:
  group: live-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements.txt
      - run: pip install --quiet -r live/requirements.txt
      - name: tick
        env:
          TICK_TOUCH: ${{ inputs.touch }}
        run: python live/tick.py
      - name: push if changed
        run: |
          git config user.name "pool-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          WEEK=$(python -c 'import json;print(json.load(open("data.json"))["week"])')
          git commit -q -m "week $WEEK update"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase || exit 1
          done
          git push -q
